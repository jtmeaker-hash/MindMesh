name: MindMesh Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-regression:
    name: Web application regression
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Run web lint
        run: npm --prefix web run lint

      - name: Run web type-check
        run: npm --prefix web run type-check

      - name: Run full web regression suite
        run: npm --prefix web run test -- --run

      - name: Build web and Android WebView bundle
        run: npm --prefix web run build

  android-regression:
    name: Android application regression
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Android unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build Android debug APK
        run: ./gradlew assembleDebug --stacktrace
